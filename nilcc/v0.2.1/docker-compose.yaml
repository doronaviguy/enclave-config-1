# nilCC docker-compose template for the co-signer dry-run.
#
# deploy-nilcc.sh renders this into the PUBLIC config repo (nilcc/<tag>/).
# nilCC hashes the rendered file and that hash is part of the attestation
# measurement, so every literal value below is measured and visible to
# everyone. It therefore carries no private setting:
#
# - Hidden settings (API URL, Telegram chat ID, lane-file URL and lane key)
#   travel as the nilCC environment variable DRYRUN_SECRET_CONFIG, which nilCC
#   keeps out of the measurement. Only its salted sha256 is measured, as
#   DRYRUN_CONFIG_COMMITMENT; the binary refuses to start unless the two
#   match, so a hidden change is still a new release and key.
# - The Telegram bot token is its own nilCC environment variable (a credential
#   only: it can suppress messages, never forge a signed result).
# - Lanes live in lanes.enc in the config repo, AES-256-GCM encrypted, and are
#   re-read every DRYRUN_LANES_REFRESH (default 10 minutes) with no restart.
#
# The two ${DRYRUN_SECRET_*} references are interpolated by docker compose
# from nilCC's .env at boot; the literal reference text is what is measured.
# Only those two names are passed through, so nothing else in .env can reach
# the container.
#
# The @-delimited placeholders are filled by deploy-nilcc.sh.

services:
  app:
    image: "ghcr.io/doronaviguy/enclave-app-1:v0.2.1@sha256:fccf27810ba3c432884e0bb5ccd4549eeb30676359811ed1018f1714a2042c92"
    # Read-only root filesystem: the dry-run and its scorer write nothing.
    read_only: true
    restart: unless-stopped
    environment:
      DRYRUN_RELEASE_TAG: "v0.2.1"
      DRYRUN_CONFIG_COMMITMENT: "0x6b3a07620d5373d48bda47ce356b3296b6810bcb5f79d97d6f79803a6e10a9f1"
      DRYRUN_PLATFORM: "nilcc"
      # nilCC's hosts get HTTP 451 from Binance futures; spot prices come from
      # data-api.binance.vision (futures-only markets then fail the assessment).
      DRYRUN_PRICE_SOURCE: "binance-spot"
      DRYRUN_LISTEN_ADDR: "0.0.0.0:8090"
      DRYRUN_REPO_PATH: "/app"
      DRYRUN_SECRET_CONFIG: "${DRYRUN_SECRET_CONFIG}"
      DRYRUN_SECRET_TELEGRAM_BOT_TOKEN: "${DRYRUN_SECRET_TELEGRAM_BOT_TOKEN}"
    # nilCC's Caddy proxies every path to this container (publicContainerPort
    # 8090). A sealed deployment serves only /health and /identity; the
    # attestation itself is at /nilcc/api/v2/report, served by nilCC.
